plugins {
    id 'net.fabricmc.fabric-loom'
}

description = 'Meridian 公共 Minecraft 接线：统一 /meridian 指令注册点。'

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(libs.versions.java.get()) }
}

base.archivesName = "${rootProject.name}-${project.name}"

dependencies {
    // 26.x 不混淆：直接用官方名编译，没有映射，模组依赖也不经重映射。
    minecraft libs.minecraft
    implementation libs.fabric.loader
    implementation libs.fabric.api
    // 登记错误文案统一在服务端库的 MeridianErrors；服务端库由各附属按装配清单装入，这里不嵌套。
    implementation project(':server')
}

tasks.withType(JavaCompile).configureEach {
    options.release = libs.versions.java.get().toInteger()
    options.encoding = 'UTF-8'
}

tasks.withType(Jar).configureEach {
    from(rootProject.files('LICENSE', 'NOTICE', 'THIRD_PARTY_NOTICES.md'))
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

loom {
    mods {
        meridian_framework { sourceSet sourceSets.main }
        meridian_framework_test { sourceSet sourceSets.gametest }
    }
    runs {
        // 注册点回归只装本模组和两个测试附属，不读完整装配：要验证的正是未登记附属的节点不存在。
        gametest {
            server()
            name 'Meridian Framework GameTest'
            source sourceSets.gametest
            runDir 'build/gametest'
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dfabric-api.gametest.report-file=build/gametest-results.xml'
        }
    }
}

tasks.named('runGametest') {
    doFirst {
        // 每局从空目录新建世界：GameTest 服务端按自带的平坦预设建世界，旧目录只会累积上一局的区块、实体、假玩家与模组存档。
        // 26.2 把生成设置与游戏规则拆到了 data/minecraft，只留 level.dat 会退回随机种子的默认地形，所以整个目录删掉。
        file('build/gametest/world').deleteDir()
    }
}
