# 环境真元配置 v2。部分覆盖文件可以省略其他字段；完整默认值由此文件提供。
config_version = 2

[region]
# 横向 N×N chunk；一个 chunk 为 16×16 格，高度采用宿主世界的有效高度。
size_chunks = 1

[absorption]
# 元/格 × 格/秒 = 元/秒。实际吸收还受身体能力、共享预算和库存约束。
volume_blocks_per_second = 1.0

[diffusion]
# 基准透过速度，单位方块边长/秒；方块系数为无量纲倍率。
speed_blocks_per_second = 1.0
# 未列出的原版或附属方块采用这个保守默认值。
default_block_transmission = 0.10

[diffusion.blocks]
# 无介质空间：void 使用 void_air 表示；未加载区块不等于 void。
"minecraft:air" = 1.0
"minecraft:cave_air" = 1.0
"minecraft:void_air" = 1.0
