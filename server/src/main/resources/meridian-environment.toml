[generation]
rules_version = 1
dimension_id = "minecraft:overworld"
# 未分类地形先抽两个端点组成专属区间，再按区域身份在该区间内取值。
unclassified_min = 0.20
unclassified_max = 1.60
boundary_min = 0.25
boundary_max = 1.00
preference_jitter = 0.20

# 浓度单位元/格；权重顺序固定为金、木、水、火、土。初始值待实机平衡。
