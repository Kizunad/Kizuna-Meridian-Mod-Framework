syntax = "proto3";

package kizuna.meridian.v1;

import "kizuna/meridian/v1/body.proto";

option java_package = "dev.kizuna.meridian.protocol.pb";
option java_outer_classname = "EnvironmentMessages";

// 宿主加载 TOML 后交换的完整有效配置；省略默认值的文件不能直接作为线协议消息。
message EnvironmentQiConfig {
  int32 config_version = 1; // 当前为 2，独立于环境来源和身体版本。
  optional int32 region_size_chunks = 2; // 横向正方形区域的边长，正整数；高度由宿主世界提供。
  optional double absorption_volume_blocks_per_second = 3; // 格/模拟秒；一格指一个方块体积。
  optional double diffusion_speed_blocks_per_second = 4; // 方块边长/模拟秒；乘面积与浓度差得到元/秒。
  optional double default_block_transmission = 5; // 未列出方块的无量纲系数，范围 [0, 1)。
  repeated BlockQiTransmission block_transmissions = 6; // 方块 ID 唯一；允许第三方系数超过 1。
  TerrainQiGenerationConfig generation = 7; // 完整地形生成配置，客户端不能修改。
}

message EnvironmentNumericRange {
  optional double minimum = 1;
  optional double maximum = 2;
}

// 五行权重先归一化再分配总量；不是五份独立的浓度。
message FiveElementWeights {
  optional double metal = 1;
  optional double wood = 2;
  optional double water = 3;
  optional double fire = 4;
  optional double earth = 5;
}

message TerrainQiProfile {
  string id = 1;
  repeated string biome_ids = 2; // 精确 ID 映射，空列表可停用该预设的匹配。
  EnvironmentNumericRange concentration = 3; // 元/格。
  FiveElementWeights weights = 4;
}

message TerrainQiGenerationConfig {
  optional int32 rules_version = 1; // 随机算法版本，当前为 1。
  string dimension_id = 2; // 默认主世界；其他维度须显式安装自己的配置。
  EnvironmentNumericRange unclassified_concentration = 3; // 未分类地形的随机区间从此范围内抽取。
  EnvironmentNumericRange boundary_transmission = 4; // 相邻区域共享的随机传播倍率。
  optional double preference_jitter = 5; // 每种权重独立乘 [1-jitter, 1+jitter)，范围 [0,1)。
  repeated TerrainQiProfile profiles = 6;
}

// 可信世界生成数据，不是客户端请求；宿主只对尚未初始化的区域调用。
message TerrainQiRegionRequest {
  int32 protocol_version = 1;
  string world_seed = 2; // 稳定种子文本；Minecraft 长整数采用十进制，不丢失负号。
  string dimension_id = 3;
  string source_id = 4; // 稳定且唯一的区域身份，可包含负坐标。
  string biome_id = 5; // 由地形生成元数据提供，无需扫描方块。
  optional double volume_blocks = 6;
}

// 首次初始化的候选值；保存此记录不等于新增一份可独立使用的环境库存。
message TerrainQiRegionSeed {
  TerrainQiRegionRequest request = 1;
  optional int32 rules_version = 2;
  EnvironmentNumericRange concentration = 3; // 本地形实际采用的区间，含未分类地形的抽样结果。
  FiveElementWeights weights = 4; // 区域扰动后的五行权重。
  QiInventory initial_qi = 5; // 游离态五行灵气；实际库存由宿主原子初始化并持久化。
}

message TerrainQiBoundaryRequest {
  int32 protocol_version = 1;
  string world_seed = 2;
  string dimension_id = 3;
  string boundary_id = 4;
  string first_source_id = 5;
  string second_source_id = 6;
  optional double area_blocks = 7;
  optional int64 rules_revision = 8; // 宿主安装配置的世代，区别于随机算法版本。
}

message BlockQiTransmission {
  string block_id = 1; // namespace:path；air/cave_air/void_air 必须显式配置为 1。
  optional double transmission = 2; // 有限非负；0 阻断，1 为空气基准，大于 1 为增强传播。
}

// 宿主根据生成结果或内容定义登记的独立混合空间；source_id 对应唯一环境账户。
message EnvironmentSpace {
  int32 protocol_version = 1; // 当前为 1。
  string source_id = 2;
  EnvironmentSpaceKind kind = 3;
  optional double volume_blocks = 4; // 正数，方块体积；从背景区域划出房间时同步扣减背景体积。
}

enum EnvironmentSpaceKind {
  ENVIRONMENT_SPACE_KIND_UNSPECIFIED = 0;
  REGION_BACKGROUND = 1; // chunk 区域中未被局部空间占用的背景。
  LOCAL_ROOM = 2; // 特殊结构登记的局部房间，可跨 chunk。
  LOCAL_CHANNEL = 3; // 通道的一段独立混合空间，通过端口连接相邻空间。
}

// 两个空间共享的边界缓存。普通生成边界可用一个分片，多端口定义可用多个。
// 宿主负责分片互不重叠、边界唯一及范围正确；缓存不持有真元。
message EnvironmentBoundarySnapshot {
  int32 protocol_version = 1;
  string boundary_id = 2;
  string first_source_id = 3;
  string second_source_id = 4;
  optional int64 revision = 5; // 缓存更新版本，与来源账户版本分开。
  optional int64 rules_revision = 6; // 宿主安装传播规则的世代，不是 config_version。
  optional bool ready = 7; // false 表示边界定义尚未就绪或已失效，禁止据此计算传播。
  repeated EnvironmentBoundaryPatch patches = 8;
}

message EnvironmentBoundaryPatch {
  string patch_id = 1; // 在所属边界内唯一，增量更新沿用同一 ID。
  optional double area_blocks = 2; // 正数，接触方块面数。
  optional double transmission = 3; // 已生成或显式配置的传播倍率；允许 0 和大于 1。
}

// 可信宿主发送的完整单分片替换或删除。不是客户端修改环境的入口。
message EnvironmentBoundaryPatchUpdate {
  string boundary_id = 1;
  optional int64 expected_revision = 2;
  optional int64 rules_revision = 3;
  oneof operation {
    EnvironmentBoundaryPatch upsert = 4;
    string remove_patch_id = 5;
  }
}

// 宿主根据身体位置、环境库存和供给策略生成的可信事实，不是客户端请求。
// offer 不预扣或预留资源；提交时仍须检查来源版本、库存和共享供给预算。
message EnvironmentQiOffer {
  int32 protocol_version = 1; // 必须为 1；独立于来源 revision 和身体 schema。
  string source_id = 2; // 宿主管理的稳定账户标识，跨世界唯一且不得复用。
  optional int64 source_revision = 3; // 该来源的非负权威版本。
  string body_id = 4; // 供给仅对这具身体有效，不可移用给其他身体。
  QiInventory available_qi = 5; // 该版本允许本次吸收的明细上限，单位元；不是新增库存。
  optional double max_absorption_per_second = 6; // 本身体所有种类合计上限，元/模拟秒；允许 0。
  TimeCursor valid_from = 7;
  TimeCursor valid_until = 8; // 同域同世代，半开区间 [from, until)，必须有正时长。
}

// 权威身体计算产生的候选交换；通过校验不代表已经提交。
// 一次只绑定一个来源。吸收与释放分别记毛额，不能先相抵再检查供给额度。
message EnvironmentQiExchange {
  string exchange_id = 1; // 权威端生成；同一身体内永久唯一，重试保留原 ID 和原内容。
  EnvironmentQiOffer offer = 2;
  optional int64 expected_body_revision = 3;
  TimeCursor started_at = 4;
  TimeCursor ended_at = 5; // [start, end) 在 offer 区间内；纯释放允许同一时刻。
  QiInventory absorbed_qi = 6; // 环境扣除、进入身体处理链的原始真元，逐种类不得超过 available_qi。
  QiInventory released_qi = 7; // 身体扣除、环境接收的真元；包括转换损耗，不可重复发放。
}

// 身体、环境和回执原子提交后的持久化事实；读取和重放回执都不能再次转账。
// 去重键为 offer.body_id + exchange_id；相同键不同已解码内容必须拒绝。
message EnvironmentQiReceipt {
  EnvironmentQiExchange exchange = 1;
  optional int64 body_revision = 2; // expected_body_revision + 1。
  optional int64 source_revision = 3; // offer.source_revision + 1。
}

// 唯一环境库存及共享供给账；窗口速率由窗口开启时的浓度计算，提交不能重置预算。
message EnvironmentQiSource {
  EnvironmentSpace space = 1;
  optional int64 revision = 2;
  QiInventory inventory = 3;
  TimeCursor valid_from = 4;
  TimeCursor valid_until = 5;
  optional double max_absorption_per_second = 6;
  repeated EnvironmentQiUsage usage = 7; // 已提交的合计速率分段，按时间排序且互不重叠。
}

message EnvironmentQiUsage {
  optional int64 started_millis = 1;
  optional int64 ended_millis = 2;
  optional double qi_per_second = 3; // 正数；包括所有身体、所有属性的摄入。
}
