syntax = "proto3";

package kizuna.meridian.v1;

import "kizuna/meridian/v1/body.proto";
import "google/protobuf/any.proto";
import "kizuna/meridian/v1/environment.proto";
import "kizuna/meridian/v1/opening.proto";
import "kizuna/meridian/v1/health.proto";
import "kizuna/meridian/v1/activity.proto";

option java_package = "dev.kizuna.meridian.protocol.pb";
option java_outer_classname = "MeridianMessages";

// 传输单元为整个消息的原始 Protobuf bytes，无 JSON/额外长度前缀。
// 请求和响应严格分开；快照没有客户端上传入口。
// Java 参考查询处理器已实现；身份由宿主认证，读取权限与快照来源由宿主注入。
// 其他语言可实现相同契约；实际网络与持久化由宿主提供。
message RequestEnvelope {
  int32 protocol_version = 1; // 必须为 1。
  string request_id = 2; // 用于关联响应，不代表身份或权限。
  oneof request {
    GetBodySnapshot get_body_snapshot = 10;
    BodyCommand body_command = 11;
    GetTissueCapability get_tissue_capability = 12;
  }
}

message GetBodySnapshot {
  string body_id = 1; // 目标身份不能代替宿主对操作者的认证。
}

message GetTissueCapability {
  string body_id = 1;
  string tissue_id = 2;
}

message TissueCapability {
  string body_id = 1;
  string tissue_id = 2;
  optional int64 revision = 3;
  TissueCapacity available = 4; // 当前力量、功率上限及可用做功预算。
}

// 调用者只能提交意图；身份、实际余额和许可不由请求声明。
message BodyCommand {
  string body_id = 1;
  optional int64 expected_revision = 2;
  oneof operation {
    SpendLifespan spend_lifespan = 10;
    AdvanceTime advance_time = 11;
    TransportQi transport_qi = 12;
    StartOrganRecipe start_organ_recipe = 13;
    ExertTissue exert_tissue = 14;
    IntakeQi intake_qi = 15;
    ExertTissues exert_tissues = 16;
    StartAction start_action = 17;
    StopAction stop_action = 18;
    StartMeridianOpening start_meridian_opening = 19;
    PauseMeridianOpening pause_meridian_opening = 20;
    DebugQi debug_qi = 21; // 默认拒绝；可信宿主须另行开启管理员调试授权。
    CaptureQi capture_qi = 22; // 仅可信命中入口；普通网络命令入口拒绝。
    DamageBody damage_body = 23; // 以下效果只允许可信宿主入口提交。
    HealBody heal_body = 24;
    RestoreFatigue restore_fatigue = 25;
    ConfirmBodyDeath confirm_body_death = 26; // 仅可信宿主确认外部死亡，不能由客户端上报。
    SetPartHealthLimits set_part_health_limits = 27;
    SetAddonProgress set_addon_progress = 28; // 仅可信附属入口；客户端不能自报解锁。
    BodyActivity execute_activity = 29; // 仅可信活动入口，整体守恒、容量及负载校验。
    FillModuleTags fill_module_tags = 30; // 仅可信构型维护入口，补齐空标签，不覆盖已有标签。
  }
}

message FillModuleTags {
  repeated ModuleTagAssignment modules = 1; // 同类实际 ID 唯一，整批成功或拒绝。
}

message ModuleTagAssignment {
  oneof module {
    string tissue_id = 1;
    string organ_id = 2;
    string meridian_id = 3;
  }
  repeated string tags = 4; // 非空、唯一的 namespace:path 集合；已有集合须完全一致。
}

message SetAddonProgress {
  string id = 1; // namespace:path
  google.protobuf.Any progress = 2; // 由所属附属校验内容 schema，框架只约束大小和类型标识。
}

// 仅注入游离态无属性真元，保留既有余额、在途、外壁和开拓状态。
message DebugQi {
  DebugQiMode mode = 1;
  string meridian_id = 2; // 全身 fill 为空；局部 fill / 扩散必须指定真实经脉。
  optional double amount = 3; // fill 是期望局部总量；diffuse 是新增量，不能超过扣预约后的可用容量。
  double density = 4; // SET_INVENTORY 专用；普通 fill 和 diffuse 仍产生 0.01。
  bool wall = 5; // SET_INVENTORY 选择外壁，默认内腔。
}
enum DebugQiMode {
  DEBUG_QI_UNSPECIFIED = 0;
  FILL_LUMENS = 1;
  INJECT_FOR_DIFFUSION = 2; // 模拟炼化后入脉，后续沿真实连接扩散，不伪造环境摄入证明。
  SET_INVENTORY = 3; // 管理员精确设置数量与密度，不作为普通资源来源。
}

message StartAction {
  string instance_id = 1;
  string action_id = 2;
  int32 action_version = 3;
}

message StopAction {
  string instance_id = 1; // 仅结束这一实例；其他动作的占用仍有效。
}

// 摄入目标器官与原始明细；时间、位置、来源和效率不能由客户端声明。
message IntakeQi {
  string organ_id = 1;
  QiInventory qi = 2; // 正数总量，整笔成功或拒绝；保留相态与属性。
  repeated ExertTissue loads = 3; // 可选：本次摄入的组织代价，与环境和身体入账原子提交。
}

message OrganIntakeResult {
  TimeAdvancePlan plan = 1; // 从身体旧游标到可信目标时刻，成功同时推进年龄与游标。
  EnvironmentQiReceipt environment = 2;
}

// 宿主已确认接触的一个灵气团；数量由锁定环境的浓度推导，不能由玩家报告命中。
message CaptureQi {
  string organ_id = 1;
  string recipe_id = 2;
  int32 recipe_version = 3;
  double sample_volume_blocks = 4; // 一个粒子代表的环境体积，由生物吐纳配置提供。
}

message QiCaptureResult {
  OrganRecipe recipe = 1; // 采用的比例定义；接触摄入即时转换，不等待固定批次时长。
  EnvironmentQiReceipt environment = 2;
}

// 首片只支持非致死支出；这是宿主授权的身体操作，不是任意玩家扣寿命的权限。
message SpendLifespan {
  double seconds = 1; // 正数生物秒；不得达到或超过剩余寿命。
}

// 只请求结算；客户端不能提交时间、离线时长或老化倍率。
message AdvanceTime {}

// 沿已存在连接在经脉内腔/器官缓存间发运；不允许指定抵达时间、覆盖余额或调用外壁储备。
message TransportQi {
  string connection_id = 1;
  QiInventory cargo = 2;
  double throughput_per_second = 3; // 申请占用的两端共享吞吐，必须为正数。
}

message StartOrganRecipe {
  string organ_id = 1;
  string recipe_id = 2;
  int32 recipe_version = 3;
}

// 宿主授权的单次组织做功；不自动生成攻击伤害或世界位移。
message ExertTissue {
  string tissue_id = 1;
  double force_newtons = 2;
  double power_watts = 3;
  double duration_seconds = 4;
}

// 同一动作同时消耗多个组织预算，整批校验后一次提交。
message ExertTissues {
  repeated ExertTissue loads = 1;
}

// 宿主内部可信事实，不是 RequestEnvelope 的可上传字段。
// 一段结算区间内倍率、模式和动作占用必须固定；切换动作前先结清旧区间。
message TimeAdvancePlan {
  TimeCursor target = 1;
  optional double biological_seconds_per_simulation_second = 2;
  TimeAdvanceMode mode = 3;
  reserved 4;
  reserved "resting_tissue_ids";
}

enum TimeAdvanceMode {
  TIME_ADVANCE_MODE_UNSPECIFIED = 0;
  ACTIVE = 1; // 结算经脉/器官到达与加工；组织端口运输仍未实现。
  LIFESPAN_ONLY = 2; // 其他变化冻结，在途剩余时间保持不变。
}

// 与身体及回执一起保存；死亡释放与加工损耗由宿主事务入环境账，不能在审计回调中发放。
message TimeAdvanceResult {
  TimeAdvancePlan plan = 1;
  TimeCursor settled_at = 2; // 寿命耗尽时停在死亡边界，可能早于 target。
  optional bool died = 3;
  QiInventory released_qi = 4; // 死亡释放保留类型，加工损耗为无属性游离态；后续环境退化另行处理。
}

message CommandCommitted {
  string body_id = 1;
  optional int64 previous_revision = 2;
  optional int64 revision = 3; // 一次成功变更恰好增加 1。
}

// 宿主内部持久化记录，不是客户端上传入口。与新身体快照一起原子保存。
// 去重键为可信 caller_id + body_id + request_id；按已解码命令比较，不比较原始字节。
message CommandReceipt {
  string caller_id = 1;
  string request_id = 2;
  BodyCommand command = 3;
  CommandCommitted committed = 4;
  TimeAdvanceResult time_advance = 5; // 仅 advance_time 回执必填，其他操作必须缺省。
  OrganRecipe organ_recipe = 6; // 仅 start_organ_recipe 必填，记录宿主解析的配方。
  OrganIntakeResult organ_intake = 7; // 仅 intake_qi 必填，包含同一次身体提交的环境回执。
  ActionDefinition action_definition = 8; // 仅 start_action 必填，保存可信目录解析的定义。
  OpeningCommandResult opening = 9; // 仅开脉开始/暂停必填；释放与身体原子提交。
  QiCaptureResult qi_capture = 10; // 仅 capture_qi 必填；保存环境扣账与所用配方。
  HealthResult health = 11; // 仅伤害、治疗、主动恢复必填；重试不重复作用。
}

message OpeningCommandResult {
  MeridianOpeningRule rule = 1;
  ActionDefinition action = 2;
  QiInventory released_qi = 3;
}

message ResponseEnvelope {
  int32 protocol_version = 1;
  string request_id = 2;
  oneof result {
    BodySnapshot body_snapshot = 10; // 仅向有权读取完整身体的调用方发送。
    RequestFailure failure = 11;
    CommandCommitted command_committed = 12;
    TissueCapability tissue_capability = 13;
  }
}

message RequestFailure {
  FailureCode code = 1; // 不发送异常堆栈或私有策略详情。
}

enum FailureCode {
  FAILURE_CODE_UNSPECIFIED = 0;
  INVALID_REQUEST = 1;
  ACCESS_DENIED = 2;
  BODY_NOT_FOUND = 3;
  UNSUPPORTED_VERSION = 4;
  INTERNAL_ERROR = 5;
  REVISION_CONFLICT = 6;
  REQUEST_ID_CONFLICT = 7;
  BODY_DEAD = 8;
  INSUFFICIENT_LIFESPAN = 9;
  REVISION_EXHAUSTED = 10;
  NUMERIC_LIMIT = 11;
  CLOCK_MISMATCH = 12;
  TIME_NOT_ADVANCED = 13;
  PENDING_TIME_EVENT = 14;
  ROUTE_NOT_FOUND = 15;
  ROUTE_UNSUPPORTED = 16;
  ROUTE_UNAVAILABLE = 17;
  INSUFFICIENT_QI = 18;
  CAPACITY_EXCEEDED = 19;
  THROUGHPUT_EXCEEDED = 20;
  TIME_REQUIRES_SETTLEMENT = 21;
  TRANSPORT_FROZEN = 22;
  MODULE_NOT_FOUND = 23;
  MODULE_UNAVAILABLE = 24;
  RECIPE_NOT_FOUND = 25;
  RECIPE_INCOMPATIBLE = 26;
  ORGAN_BUSY = 27;
  TISSUE_LOAD_EXCEEDED = 28;
  INTAKE_UNSUPPORTED = 29;
  ENVIRONMENT_UNAVAILABLE = 30;
  ENVIRONMENT_REVISION_CONFLICT = 31;
  ENVIRONMENT_INTERVAL_INVALID = 32;
  ENVIRONMENT_BUDGET_EXCEEDED = 33;
  MERIDIAN_UNOPENED = 34;
  GATHERING_BUSY = 35;
  ACTION_NOT_FOUND = 36;
  ACTION_ALREADY_ACTIVE = 37;
  ACTION_NOT_ACTIVE = 38;
  ACTION_LIMIT_EXCEEDED = 39;
  OPENING_RULE_NOT_FOUND = 40;
  OPENING_BUSY = 41;
  MERIDIAN_ALREADY_OPENED = 42;
  OPENING_REQUIREMENTS_UNMET = 43;
  OPENING_NOT_ACTIVE = 44;
  OPENING_POLICY_UNAVAILABLE = 45;
  DAMAGE_HANDLER_UNAVAILABLE = 46;
}
