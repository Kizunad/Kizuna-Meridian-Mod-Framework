syntax = "proto3";

package kizuna.meridian.v1;

option java_package = "dev.kizuna.meridian.protocol.pb";
option java_outer_classname = "BodyMessages";

import "google/protobuf/any.proto";

// 字段编号与枚举值属于跨语言契约，不依赖 Java ordinal；删除时必须 reserved。
// optional 数值/布尔字段必须显式提供，合法的 0/false 不等于缺失。
// 单值消息默认必填；OrganState.process 空闲时缺省，OrganDefinition.intake 无摄入能力时缺省。
// 字符串非空，repeated 可为空。
// 此文件是数据格式，不授予客户端覆盖权威状态的权限。

enum Realm {
  REALM_UNSPECIFIED = 0;
  WANDERING_QI = 1; // 游炁：炁在脉中零散游走，和外界的游离灵气是同一种状态。
  TRUE_QI = 2; // 真炁：炼成真炁，能在经脉里运转周天。
  ESSENCE_TRANSFORMATION = 3; // 化元：炁化为元，真元有了重量，能在脉中流动。
  ESSENCE_CONDENSATION = 4; // 凝元：元凝成实体。
  HEAVENLY_PATTERN = 5; // 天纹：真元排列成纹，和天地的纹理同构。
  VOID_TRANSFORMATION = 6; // 化虚：天纹在高密度下耦合干涉，相长时极实，相消时化实为虚。
}

enum QiPhase {
  QI_PHASE_UNSPECIFIED = 0;
  FREE = 1; // 游离态，对应游炁。
  GAS = 2; // 气态，对应真炁。
  LIQUID = 3; // 液态，对应化元。
  SOLID = 4; // 固态，对应凝元。
  ORDERED = 5; // 有序态，对应天纹。
  COHERENT = 6; // 相干态，对应化虚。
}

enum PortDirection {
  PORT_DIRECTION_UNSPECIFIED = 0;
  INPUT = 1;
  OUTPUT = 2;
  BIDIRECTIONAL = 3;
}

enum MeridianCondition {
  MERIDIAN_CONDITION_UNSPECIFIED = 0;
  INTACT = 1;
  LEAKING = 2;
  SEVERED = 3;
}

enum MeridianOpeningStage {
  MERIDIAN_OPENING_STAGE_UNSPECIFIED = 0;
  UNOPENED = 1;
  IN_PROGRESS = 2; // 已开始但尚未完成；可以保存暂停后的进度，不表示任务正在执行。
  OPENED = 3;
}

message TemplateReference {
  string id = 1; // namespace:path
  int32 version = 2; // 正整数内容版本，独立于协议版本。
}

message BodyTemplate {
  TemplateReference reference = 1;
  BodyStructure structure = 2;
}

message BodyStructure {
  repeated PartDefinition parts = 1;
  repeated TissueDefinition tissues = 2;
  repeated OrganDefinition organs = 3;
  repeated MeridianDefinition meridians = 4;
  repeated Connection connections = 5;
}

// 选择独立 HP 账户；伤害分配、连带损伤与致死规则由生物 Addon 提供。
message HealthTarget {
  oneof module {
    string part_id = 1;
    string tissue_id = 2;
    string organ_id = 3;
  }
}

message PartDefinition {
  string id = 1;
  string display_name = 2;
  double max_hp = 3;
}

message TissueDefinition {
  string id = 1;
  string display_name = 2;
  string kind = 3; // namespace:path，不封闭第三方组织类型。
  string part_id = 4;
  double max_hp = 5;
  double fatigue_capacity = 6;
  repeated Port ports = 7;
  TissueCapacity capacity = 8; // 组织自身的基础能力；被动组织可显式全零。
  reserved 9;
  reserved "rest_recovery_per_second";
  double recovery_half_life_seconds = 10; // 未被动作使用时，剩余疲劳减半所需模拟秒；0 禁用自然恢复。
  repeated string tags = 11; // namespace:path；每个定义最多 16 个且不重复，框架不解释语义。
}

message TissueCapacity {
  optional double strength_newtons = 1;
  optional double burst_watts = 2;
  optional double endurance_joules = 3;
}

message OrganDefinition {
  string id = 1;
  string display_name = 2;
  string kind = 3;
  string part_id = 4;
  double max_hp = 5;
  repeated Port ports = 6;
  reserved 7;
  reserved "qi_capacity";
  double volume_capacity = 11; // 缓存、加工输入与输出预留共同占用的液态参照体积。
  double throughput_per_second = 8; // 端口收发共享吞吐，元/秒。
  OrganIntakeCapability intake = 9; // 可缺省：没有环境摄入能力。实际改造参数随构型保存。
  OrganEndurance endurance = 10; // 可缺省：不具备独立做功预算。
  repeated string tags = 12; // 与组织、经脉共用标签格式和数量约束。
}

message OrganEndurance {
  double endurance_joules = 1;
  double maximum_watts = 2;
  double recovery_half_life_seconds = 3; // 无动作占用时疲劳指数衰减，0 禁用。
}

message OrganIntakeCapability {
  optional double max_qi_per_second = 1; // 正数，独立于器官端口搬运吞吐；原始真元不在此转换。
}

message MeridianDefinition {
  string id = 1;
  string display_name = 2;
  repeated string part_ids = 3;
  reserved 4, 5, 6, 7;
  reserved "lumen_capacity", "wall_capacity", "lumen_liquid_reference", "wall_liquid_reference";
  double lumen_volume = 12; // 稳定内腔体积，数量上限由实际密度推导。
  optional double wall_volume = 13; // 外壁独立体积，拓宽内腔不改变它。
  double throughput_per_second = 8; // 元/模拟秒
  double resilience = 9;
  double fatigue_capacity = 10;
  repeated Port ports = 11;
  repeated string tags = 14; // 标签属于定义，不在 MeridianState 中重复保存。
}

message Port {
  string id = 1; // 整具身体内唯一。
  PortDirection direction = 2;
}

message Connection {
  string id = 1;
  string from = 2;
  string to = 3;
  optional double resistance = 4;
  double distance = 5; // 米
  PassiveQiFlow passive_qi_flow = 6; // 可缺省：仅主动运输；声明时两端必须是不同经脉。
}

// 可信构型定义的自然扩散；未开脉也能流动，客户端不能通过运输请求开启此权限。
message PassiveQiFlow {
  double throughput_per_second = 1; // 元/模拟秒，仍受两端共享吞吐限制。
  double maximum_batch_qi = 2; // 单批最多搬运的元数。
  double minimum_batch_qi = 3; // 小于此值停止调度，防止接近平衡后无限空转。
}

message PartState {
  string id = 1;
  optional double hp = 2;
}

message TissueState {
  string id = 1;
  optional double hp = 2;
  optional double fatigue = 3;
}

message OrganState {
  string id = 1;
  optional double hp = 2;
  QiInventory buffer = 3;
  OrganProcess process = 4; // 可缺省：当前没有加工任务。
  double fatigue_joules = 5; // 器官独立疲劳，不与控制组织的精力混账。
}

// 可信内容定义；客户端只能提交配方 ID 与版本，不能提交这些参数。
message OrganRecipe {
  string id = 1;
  int32 version = 2;
  string organ_kind = 3;
  QiInventory input = 4;
  QiInventory output = 5; // 数量不得超过输入；差额以无属性游离态释放到环境。
  int64 duration_millis = 6; // 正数模拟毫秒。
  Realm minimum_realm = 7;
}

message OrganProcess {
  OrganRecipe recipe = 1; // 发起时固定的事实；缺包或新版配方不能改写已经扣除的输入。
  int64 completion_millis = 2;
  optional bool blocked = 3; // 已到期但器官/归属部位失能，等待恢复事件。
  QiInventory input = 4; // 已扣除的真实原料，保留实际密度，配方输入仅用于匹配剂量。
}

message Qi {
  reserved 1;
  reserved "phase";
  string attribute = 2; // namespace:path，五行与第三方属性使用同一表达。
  double amount = 3; // 元：账户明细必须为正数，空账户用空列表。
  double density = 4; // ρ，液态基准为 1；相态由密度区间推导，最小 0.01。
}

message QiInventory {
  repeated Qi entries = 1; // 同相态同属性只能有一条明细。
}

message MeridianState {
  string id = 1;
  QiInventory lumen_qi = 2;
  QiInventory wall_qi = 3;
  optional double fatigue = 4;
  MeridianCondition condition = 5;
  MeridianOpening opening = 6; // 必填，独立于损伤和两类真元账户。
}

message MeridianOpening {
  MeridianOpeningStage stage = 1;
  optional double progress = 2; // 无量纲比例：未开拓为 0，未完成为 [0, 1)，已开拓为 1。
}

message QiTransit {
  string id = 1;
  string connection_id = 2;
  QiInventory cargo = 3; // 已扣源且尚未入目标的独立账户。
  optional int64 arrival_millis = 4;
  double throughput_per_second = 5; // 发运时预约的两端共享吞吐；阻塞后不再占用吞吐。
  TransitStatus status = 6;
  ControlledCircuit circuit = 7; // 可信活动控制的闭环货物；普通到达器不自动兑现。
}

message ControlledCircuit {
  repeated string connection_ids = 1; // 顺序闭环，connection_id 等于最后一条，目标为返回账户。
  double internal_distance_meters = 2; // 模块内部路程；连接自身长度另行累加。
  double work_millis = 3; // 已完成的等效运输时间，操作节奏由可信活动推进。
  double duration_millis = 4; // 全路程/速度 + 批量/瓶颈吞吐，仅计一次批量。
}

enum TransitStatus {
  TRANSIT_STATUS_UNSPECIFIED = 0;
  MOVING = 1;
  BLOCKED_ROUTE = 2;
  BLOCKED_CAPACITY = 3;
}

message VitalityState {
  optional double age_seconds = 1; // 生物秒
  optional double lifespan_limit_seconds = 2;
  optional double spent_lifespan_seconds = 3;
  optional bool dead = 4;
}

message TimeCursor {
  string domain = 1; // namespace:path
  string epoch = 2;
  optional int64 elapsed_millis = 3; // 非负模拟毫秒，不是系统时间戳。
}

message BodySnapshot {
  int32 schema_version = 1; // 当前为 3；密度模型不兼容旧的独立相态字段。
  string id = 2;
  TemplateReference template = 3;
  BodyStructure structure = 4;
  Realm realm = 5;
  repeated PartState part_states = 6;
  repeated TissueState tissue_states = 7;
  repeated OrganState organ_states = 8;
  repeated MeridianState meridian_states = 9;
  repeated QiTransit transits = 10;
  VitalityState vitality = 11;
  TimeCursor settled_at = 12;
  optional int64 revision = 13;
  repeated ActiveAction actions = 14; // 同时执行的动作实例；定义固定，跨动作的组织占用取并集。
  OpeningTask opening_task = 15; // 可缺省；保留最近任务结果。
  map<string, google.protobuf.Any> addon_progress = 16; // 附属命名空间 ID → 附属自己的版本化进度；属于唯一身体存档。
  // 全身真元和剩余寿命由明细派生，不传另一份可修改总账。
}

// 生物/功法附属提供动作占用定义；做功费用使用现有受校验做功入口，不能重复计费。
message ActionDefinition {
  string id = 1;
  int32 version = 2;
  string display_name = 3;
  repeated string tissue_ids = 4; // 当前生物构型的组织 ID；包含肌肉、注意组织等，不按名称特判。
  repeated string organ_ids = 5;
  repeated string guided_meridian_ids = 6; // 主动流向接管这些经脉的自然扩散；已有在途仍正常抵达。
}

message ActiveAction {
  string instance_id = 1;
  ActionDefinition definition = 2; // 启动时固定完整定义，缺包后仍能正确占用与结束。
  int64 started_millis = 3;
}

// 内容定义与运行中的固定规则共用类型；客户端只能选择规则身份。
message MeridianOpeningRule {
  string id = 1;
  int32 version = 2;
  string display_name = 3;
  string target_meridian_id = 4;
  reserved 5, 7, 8, 11, 12, 14, 19;
  reserved "required_open_meridian_ids", "minimum_resilience", "required_active_millis",
      "minimum_body_lumen_fraction", "sequence", "intakes", "strict_lumen_threshold";
  reserved 6, 16, 21;
  reserved "minimum_lumen_qi", "lumen_capacity_gain", "guidance_buffer_qi";
  string action_id = 9;
  int32 action_version = 10;
  repeated OpeningEffort efforts = 13;
  bool continuous_hold = 15;
  double lumen_volume_gain = 24; // 完成后一次性拓宽的稳定体积，不生成真元。
  double guidance_qi_per_second = 17; // 0 禁用专用引导；仍共享实际端口吞吐。
  double guidance_batch_qi = 18;
  double hold_qi_per_second = 20; // 仅维持期间，从全身内腔按实际占用体积分摊元数费用。
  string policy_id = 22; // 可信附属策略身份；框架不提供默认开脉条件。
  google.protobuf.Any policy_config = 23; // 附属自己的 Protobuf 条件；框架只保存，不解释。
}

message OpeningGuidanceTarget {
  string meridian_id = 1;
  reserved 2;
  reserved "qi";
  double volume = 3; // 引导期望的占用体积，必须在稳定内腔体积内，不授予额外容量。
}

message OpeningEffort {
  oneof module {
    string tissue_id = 1;
    string organ_id = 3;
  }
  double watts = 2;
}

message OpeningIntakeSample {
  string organ_id = 1;
  int64 at_millis = 2;
  double qi = 3; // 仅来自成功提交的环境摄入。
}

enum OpeningTaskStatus {
  OPENING_TASK_STATUS_UNSPECIFIED = 0;
  OPENING_PREPARING = 1;
  OPENING_HOLDING = 2;
  OPENING_PAUSED = 3;
  OPENING_EXHAUSTED = 4;
  OPENING_DAMAGED = 5;
  OPENING_COMPLETED = 6;
}

message OpeningTask {
  MeridianOpeningRule rule = 1; // 固定启动规则，缺包后仍可正确推进和清理。
  string action_instance_id = 2;
  repeated OpeningGuidanceTarget participants = 3;
  int64 required_millis = 4;
  reserved 5;
  reserved "target_stable_capacity";
  double target_stable_volume = 12;
  int64 started_millis = 6;
  int64 held_millis = 7;
  OpeningTaskStatus status = 8;
  repeated OpeningIntakeSample intake_samples = 9;
  repeated string observed_organ_ids = 10;
  int64 receipt_window_millis = 11;
}
