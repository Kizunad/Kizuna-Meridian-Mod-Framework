// Kizuna 工作区跨仓目录与产物位置的唯一来源，仓库与模块列表在同目录 assembly.json，第三方版本在 libs.versions.toml。
// settings 脚本和工程脚本都可以应用；应用后通过 kizunaWorkspace 查询，不再各自声明 meridianFrameworkDir 一类属性。
// 代码根目录默认是当前构建根目录的上一级，-PkizunaCodeDir 整体改指；-Pkizuna.dir.<清单 id> 只改指单个仓库。
import groovy.json.JsonSlurper

def manifest = new JsonSlurper().parse(new File(buildscript.sourceFile.parentFile, 'assembly.json'), 'UTF-8')
def codeDirectory = providers.gradleProperty('kizunaCodeDir')
        .map { String value -> rootDir.toPath().resolve(value).normalize().toFile() }
        .getOrElse(rootDir.parentFile)

def repositoryById = { String id ->
    // 清单 id 写错时立即失败，不能拼出一个不存在的兄弟目录。
    def repository = manifest.repositories.find { it.id == id }
    if (repository == null) {
        throw new GradleException("装配清单 assembly.json 没有仓库：${id}")
    }
    return repository
}

def directoryOf = { String id ->
    // 单仓改指优先（例如审阅快照），其余仓库都在代码根目录下按清单目录名查找。
    def repository = repositoryById(id)
    return providers.gradleProperty("kizuna.dir.${id}")
            .map { String value -> rootDir.toPath().resolve(value).normalize().toFile() }
            .getOrElse(new File(codeDirectory, repository.directory))
}

def artifactOf = { String id, String modulePath, boolean development ->
    // 产物名为「根工程名[-模块]-版本」；Loom 的 named 开发 JAR 在 build/devlibs，安装 JAR 和纯 Java 库在 build/libs。
    def repository = repositoryById(id)
    String version = repository.version ?: manifest.version
    String basename = modulePath ? "${repository.project}-${modulePath}" : repository.project
    File moduleDirectory = modulePath ? new File(directoryOf(id), modulePath) : directoryOf(id)
    if (development) {
        return new File(moduleDirectory, "build/devlibs/${basename}-${version}-dev.jar")
    }
    return new File(moduleDirectory, "build/libs/${basename}-${version}.jar")
}

// 以源码组合进来的清单模块（「仓库 id:模块路径」→ 替换坐标），只有 settings 中 includeSource 会登记。
// 每次登记同时汇总到最外层构建：下游 → Damage → 功法库这类嵌套组合由各自 settings 登记，最外层的完整装配
// 据此按坐标装入整条组合闭包；同一模块以先登记（最外层 settings 先求值）的坐标为准，与实际生效的替换规则一致。
Map<String, String> sourceModules = [:]
def outermostGradle = gradle
while (outermostGradle.parent != null) {
    outermostGradle = outermostGradle.parent
}
def compositeRegistry = outermostGradle.extensions.extraProperties
if (!compositeRegistry.has('kizunaSourceModules')) {
    compositeRegistry.set('kizunaSourceModules', [:])
}
Map<String, String> compositeSourceModules = compositeRegistry.get('kizunaSourceModules')
// 嵌套构建只看自己的登记，否则其完整装配会按坐标反向依赖组合它的下游仓库。
boolean outermostBuild = gradle.parent == null
def workspace = [
        manifest     : manifest,
        codeDirectory: codeDirectory,
        repository   : repositoryById,
        directory    : directoryOf,
        artifact     : artifactOf,
        sourceModules: outermostBuild ? compositeSourceModules : sourceModules
]
ext.kizunaWorkspace = workspace

// settings 中应用时再注册同目录的版本目录 libs，并把工作区查询交给本构建的每个工程脚本。
if (rootProject instanceof org.gradle.api.initialization.ProjectDescriptor) {
    def settingsObject = settings
    workspace.includeSource = { String id, Map<String, String> substitutions ->
        // 相邻仓库按清单目录组合构建；键为清单模块路径（根工程写空串），值为本仓依赖声明里使用的坐标。
        settingsObject.includeBuild(directoryOf(id)) { includedBuild ->
            includedBuild.dependencySubstitution { DependencySubstitutions rules ->
                substitutions.each { String modulePath, String coordinate ->
                    String projectPath = modulePath ? ":${modulePath}" : ':'
                    rules.substitute(rules.module(coordinate)).using(rules.project(projectPath))
                }
            }
        }
        substitutions.each { String modulePath, String coordinate ->
            String key = "${id}:${modulePath}".toString()
            sourceModules.put(key, coordinate)
            compositeSourceModules.putIfAbsent(key, coordinate)
        }
    }

    def versionCatalog = new File(buildscript.sourceFile.parentFile, 'libs.versions.toml')
    dependencyResolutionManagement {
        versionCatalogs {
            create('libs') {
                from(files(versionCatalog))
            }
        }
    }
    gradle.beforeProject { project ->
        // 工程脚本与 settings 共用同一份解析结果，下游不再自行拼相邻仓库路径。
        project.ext.kizunaWorkspace = workspace
    }
}
