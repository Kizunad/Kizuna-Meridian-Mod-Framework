// 所有 Fabric 开发入口使用同一套安装产物；装入哪些仓库和模块由同目录 assembly.json 列出，与 Windows 候选共用一份清单。
// 源码依赖仍由各仓库独立声明。localRuntime 只装配本工程运行环境，不沿 composite 的发布变体再次传递整套 JAR。
// 先构建各仓库安装 JAR，再运行客户端或 GameTest。不存在缺包启动模式。
// settings 已应用工作区脚本时沿用其结果（含源码组合登记），否则在工程内单独应用。
if (!project.hasProperty('kizunaWorkspace')) {
    apply from: new File(buildscript.sourceFile.parentFile, 'workspace.gradle')
}

repositories { maven { url = 'https://maven.wispforest.io/releases' } }

def workspace = kizunaWorkspace
Map<String, String> sourceModules = workspace.sourceModules ?: [:]
def runtimeArtifacts = []
workspace.manifest.repositories.each { repository ->
    repository.modules.findAll { it.runtime }.each { module ->
        // 当前工程的源码输出已在类路径上；同仓其他子工程的产物只在 ownProjects 列出时按文件装入。
        boolean sameRepository = repository.project == rootProject.name
        List<String> ownProjects = module.ownProjects ?: []
        if (sameRepository && !ownProjects.contains(project.name)) {
            return
        }

        // 模组走 Loom 开发重映射；纯 Java 库直接上类路径，Items 宿主库本身已是 named 开发 JAR。
        boolean namedLibrary = module.runtime == 'named-library'
        String runtimeConfiguration = module.runtime == 'mod' ? 'modLocalRuntime' : 'localRuntime'
        String sourceCoordinate = sourceModules.get("${repository.id}:${module.path}".toString())
        if (sourceCoordinate != null && !namedLibrary) {
            // 已组合为源码工程的模块按替换坐标装入，与源码依赖解析为同一组件；再读同名文件会被重映射成第二份模组。
            dependencies.add(runtimeConfiguration, sourceCoordinate)
            return
        }
        File artifact = workspace.artifact(repository.id, module.path, namedLibrary)
        def runtimeArtifact = files(artifact)
        if (sameRepository) {
            // 同仓产物必须声明任务依赖，build 与 GameTest 同次执行也不能读取尚未打包的文件。
            String packagingTask = module.runtime == 'mod' ? 'remapJar' : 'jar'
            runtimeArtifact.builtBy(module.path ? ":${module.path}:${packagingTask}" : ":${packagingTask}")
        }
        dependencies.add(runtimeConfiguration, runtimeArtifact)
        runtimeArtifacts.add(artifact)
    }
}

dependencies {
    modLocalRuntime 'io.wispforest:owo-lib:0.11.2+1.20'
}
if (rootProject.name == 'kizuna-meridian-progression-addon') {
    // 本仓通过文件调用公共库，开发运行需显式补齐安装时的嵌套核心和 TOML 依赖。
    File frameworkServer = workspace.artifact('framework', 'server', false)
    dependencies {
        localRuntime files(frameworkServer)
        localRuntime 'org.tomlj:tomlj:1.1.1'
        localRuntime 'org.antlr:antlr4-runtime:4.11.1'
    }
    runtimeArtifacts.add(frameworkServer)
}

tasks.withType(JavaExec).configureEach {
    // 开发客户端和 GameTest 与框架共同使用 Java 17，不跟随 Gradle 守护进程版本。
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    doFirst {
        // 文件依赖缺失不会被 Gradle 自动拒绝，开发运行前必须检查整套安装产物。
        runtimeArtifacts.each { File artifact ->
            if (!artifact.isFile()) {
                throw new GradleException("缺少完整装配产物，请先构建对应仓库：${artifact}")
            }
        }
    }
}
